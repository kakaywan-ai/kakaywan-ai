<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090B0A">
  <title>Kordi | Kakaywan</title>
  <script>
    try {
      const savedAppearance = localStorage.getItem("kakaywan-settings");
      const appearanceSettings = savedAppearance
        ? JSON.parse(savedAppearance)
        : {theme: localStorage.getItem("kakaywan-theme") || "system"};
      const initialTheme = appearanceSettings.theme || "system";
      const systemTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = initialTheme === "system" ? systemTheme : initialTheme;
    } catch (error) {
      console.error("Could not load Kakaywán appearance settings.", error);
    }
  </script>
  <style>
    :root {
      --black: #090B0A;
      --forest-black: #111814;
      --forest: #1B3021;
      --leaf: #B6F36B;
      --off-white: #F1F3EF;
      --gray: #A7AEA8;
      --line: rgba(241, 243, 239, .11);
      --surface: #151C17;
      --surface-2: #1A231D;
      --danger: #E9A88F;
      --sidebar: 264px;
      --thread-width: 380px;
      --text-scale: 1;
      --blob-one: rgba(119, 205, 103, .3);
      --blob-two: rgba(77, 165, 190, .3);
    }

    :root[data-theme="light"] {
      --black: #F5F5ED;
      --forest-black: #E8EDDF;
      --forest: #315C45;
      --leaf: #78A84A;
      --off-white: #263129;
      --gray: #667067;
      --line: rgba(49, 92, 69, .16);
      --surface: #FCFCF7;
      --surface-2: #E1E7DA;
      --danger: #A94F3A;
      --blob-one: rgba(115, 168, 76, .22);
      --blob-two: rgba(73, 157, 167, .28);
    }
    :root[data-text-size="small"] { --text-scale: .87; }
    :root[data-text-size="large"] { --text-scale: 1.27; }
    :root[data-theme="light"] .landing {
      background: radial-gradient(circle at 50% 58%, rgba(120, 168, 74, .08), transparent 24%), var(--black);
    }
    :root[data-theme="light"] .conversation-head { background: var(--surface); }
    :root[data-theme="light"] .bubble { background: var(--surface); }
    :root[data-theme="light"] .message-row.user .bubble-message { color: #F1F3EF; }
    :root[data-theme="light"] .search-overlay { background: rgba(26, 40, 30, .38); }
    :root[data-theme="light"] .loading-screen { background: radial-gradient(circle at 50% 48%, rgba(120, 168, 74, .11), transparent 18rem), var(--black); }
    :root[data-contrast="high"] {
      --line: rgba(241, 243, 239, .36);
      --gray: #C4CCC5;
    }
    :root[data-theme="light"][data-contrast="high"] {
      --line: rgba(28, 48, 34, .42);
      --gray: #414B42;
    }
    :root[data-reduced-motion="true"] *, :root[data-reduced-motion="true"] *::before, :root[data-reduced-motion="true"] *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--black);
      color: var(--off-white);
      font: calc(15px * var(--text-scale))/1.5 Inter, "Segoe UI", system-ui, sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 2px solid var(--leaf);
      outline-offset: 3px;
    }

    .app { display: grid; grid-template-columns: 56px minmax(0, 1fr); height: 100dvh; }
    .app.sidebar-expanded { grid-template-columns: var(--sidebar) minmax(0, 1fr); }
    .sidebar {
      position: relative;
      z-index: 30;
      display: flex;
      min-width: 0;
      flex-direction: column;
      background: var(--forest-black);
      border-right: 1px solid var(--line);
      transition: width .25s ease, transform .25s ease;
    }
    .app:not(.sidebar-expanded) .sidebar { width: 56px; }
    .app.sidebar-expanded .sidebar { width: var(--sidebar); }
    .sidebar-head {
      height: 68px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(182, 243, 107, .28);
      border-radius: 8px;
      background: #0D140F;
      overflow: hidden;
      padding: 0;
      cursor: pointer;
    }
    .brand-mark:hover { border-color: var(--leaf); box-shadow: 0 0 14px rgba(182, 243, 107, .24); }
    .brand-mark img,
    .mascot-avatar img,
    .loading-mascot img,
    .landing-mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .brand-mark img { max-width: none; }
    .brand-name { font-family: Georgia, serif; font-size: calc(18px * var(--text-scale)); font-weight: 700; white-space: nowrap; }
    .icon-btn, .nav-item {
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      border-radius: 8px;
    }
    .icon-btn:hover { background: rgba(241, 243, 239, .07); }
    .app:not(.sidebar-expanded) .brand-name,
    .app:not(.sidebar-expanded) .nav-label,
    .app:not(.sidebar-expanded) .history-section,
    .app:not(.sidebar-expanded) .sidebar-footer { display: none; }
    .app:not(.sidebar-expanded) .sidebar-head { justify-content: center; }
    .app:not(.sidebar-expanded) .sidebar-head { height: 76px; }
    .app:not(.sidebar-expanded) .sidebar-head .brand-mark { width: 30px; height: 30px; flex-basis: 30px; }
    .app:not(.sidebar-expanded) .sidebar-head { gap: 2px; padding: 4px; flex-direction: column; }

    .sidebar-nav { padding: 12px 8px; display: grid; gap: 4px; }
    .sidebar-bottom { margin-top: auto; padding: 8px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
    .nav-item {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      text-align: left;
    }
    .nav-item:hover, .nav-item.active { background: var(--surface-2); }
    .nav-icon { width: 18px; height: 18px; flex: 0 0 18px; }
    .history-section { min-height: 0; flex: 1; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
    .history-title { padding: 14px 18px 8px; color: var(--gray); font-size: calc(12px * var(--text-scale)); letter-spacing: .08em; text-transform: uppercase; }
    .history-list { overflow-y: auto; padding: 0 8px 10px; }
    .history-item {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      padding: 9px 10px;
      text-align: left;
      color: var(--gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item:hover, .history-item.active { background: var(--surface-2); color: var(--off-white); }
    .history-group-label { padding: 12px 10px 5px; color: var(--gray); font-size: calc(11px * var(--text-scale)); text-transform: uppercase; letter-spacing: .07em; }
    .history-entry { position: relative; }
    .history-entry .history-item { padding-right: 34px; }
    .history-menu-button {
      position: absolute;
      top: 5px;
      right: 3px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--gray);
      cursor: pointer;
    }
    .history-menu-button:hover { background: var(--surface-2); color: var(--off-white); }
    .app:not(.sidebar-expanded) .history-entry .history-menu-button { display: none; }
    .history-actions {
      position: fixed;
      z-index: 40;
      top: 0;
      left: 0;
      right: auto;
      width: 148px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--forest-black);
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
    }
    .history-actions[hidden] { display: none; }
    .history-actions button {
      width: 100%;
      padding: 8px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--off-white);
      text-align: left;
      cursor: pointer;
    }
    .history-actions button:hover { background: var(--surface-2); }
    .history-actions .delete-conversation { color: var(--danger); }
    .history-rename-form { display: flex; align-items: center; gap: 4px; padding: 3px; }
    .history-rename-form input {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--off-white);
    }
    .history-rename-form button {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border: 0;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--off-white);
      cursor: pointer;
    }
    .sidebar-footer { margin-top: auto; padding: 10px 12px 14px; border-top: 1px solid var(--line); }
    .footer-mark { display: flex; align-items: center; gap: 10px; color: var(--gray); font-size: calc(12px * var(--text-scale)); }

    .main { min-width: 0; height: 100dvh; position: relative; overflow: hidden; }
    .mobile-head, .backdrop { display: none; }
    .mobile-head img { width: 30px; height: 30px; object-fit: contain; }

    .landing {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(280px, 1fr) auto;
      padding: 34px 46px 24px;
      background:
        radial-gradient(circle at 50% 58%, rgba(182, 243, 107, .055), transparent 24%),
        linear-gradient(145deg, var(--black), #0C110E);
    }
    .landing > * { position: relative; z-index: 1; }
    .landing::before, .landing::after, .chat::before, .chat::after {
      content: "";
      position: absolute;
      z-index: 0;
      width: min(26vw, 280px);
      aspect-ratio: 1;
      border-radius: 62% 38% 55% 45% / 43% 58% 42% 57%;
      background: var(--blob-one);
      filter: blur(8px);
      opacity: .75;
      pointer-events: none;
      animation: blob-drift 14s ease-in-out infinite alternate;
    }
    .landing::before { top: 16%; left: 6%; }
    .landing::after { top: 40%; right: 18%; background: var(--blob-two); animation-delay: -7s; }
    .chat::before { top: 16%; right: 12%; }
    .chat::after { bottom: 10%; left: 10%; background: var(--blob-two); animation-delay: -7s; }
    .chat > .conversation-head, .chat > .messages, .chat > .chat-composer { position: relative; z-index: 1; }
    @keyframes blob-drift {
      0% { transform: translate3d(-10px, -8px, 0) rotate(0deg) scale(.92); border-radius: 62% 38% 55% 45% / 43% 58% 42% 57%; }
      50% { transform: translate3d(20px, 14px, 0) rotate(14deg) scale(1.05); border-radius: 42% 58% 38% 62% / 58% 42% 61% 39%; }
      100% { transform: translate3d(-4px, 18px, 0) rotate(-8deg) scale(.98); border-radius: 55% 45% 65% 35% / 39% 61% 44% 56%; }
    }
    .landing-head { width: min(100%, 900px); margin: 0 auto; text-align: center; }
    .landing-mascot {
      width: 74px;
      height: 74px;
      margin: 0 auto 10px;
      filter: drop-shadow(0 10px 18px rgba(182, 243, 107, .12));
      animation: mascot-float 3.8s ease-in-out infinite;
    }
    @keyframes mascot-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .landing-head h1 { margin: 0; font-family: Georgia, serif; font-size: min(calc(clamp(16px, 2.5vw, 32px) * var(--text-scale)), 4.8vw); font-weight: 700; line-height: 1.12; letter-spacing: -.02em; white-space: nowrap; }
    .landing-head p { margin: 10px auto 0; color: var(--gray); max-width: 540px; }
    .stage { position: relative; min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    .forest {
      width: min(780px, 92%);
      height: 236px;
      flex: 0 0 236px;
      transform: translateY(64px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(4px, 2.5vw, 28px);
    }
    .tree {
      position: relative;
      width: 18%;
      max-width: 142px;
      height: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 7px 5px 0;
      border: 1px solid transparent;
      border-radius: 12px 12px 2px 2px;
      background: rgba(21, 28, 23, .42);
      cursor: pointer;
      color: var(--gray);
      transition: transform .2s ease, color .2s ease, border-color .2s ease, background .2s ease;
    }
    .tree:nth-child(1) { transform: translateY(-8px) scale(.94); }
    .tree:nth-child(2) { transform: translateY(4px) scale(.86); }
    .tree:nth-child(3) { transform: translateY(-2px) scale(1.08); }
    .tree:nth-child(4) { transform: translateY(7px) scale(.9); }
    .tree:nth-child(5) { transform: translateY(-5px) scale(.96); }
    .tree:hover, .tree:focus-visible, .tree[aria-pressed="true"] { color: var(--off-white); }
    .tree:hover, .tree:focus-visible, .tree[aria-pressed="true"] { border-color: rgba(182, 243, 107, .3); background: rgba(21, 28, 23, .86); }
    :root[data-theme="light"] .tree:hover,
    :root[data-theme="light"] .tree:focus-visible,
    :root[data-theme="light"] .tree[aria-pressed="true"] {
      border-color: rgba(91, 137, 61, .46);
      box-shadow: 0 8px 24px rgba(91, 137, 61, .18), 0 0 22px rgba(155, 201, 111, .22);
    }
    .tree:hover svg, .tree:focus-visible svg { transform: translateY(-5px); filter: drop-shadow(0 8px 18px rgba(182, 243, 107, .12)); }
    .tree[aria-pressed="true"] svg { filter: drop-shadow(0 10px 24px rgba(182, 243, 107, .18)); }
    .tree svg { width: 100%; max-height: 170px; overflow: visible; transition: transform .24s ease, filter .24s ease; }
    .tree .crown { fill: #31583B; }
    .tree:nth-child(2n) .crown { fill: #3D6848; }
    .tree[aria-pressed="true"] .crown { fill: #668D50; }
    .tree .trunk { fill: #66503D; }
    .tree span { margin: 4px 0 10px; min-height: 38px; font-size: calc(12px * var(--text-scale)); font-weight: 700; line-height: 1.25; text-align: center; }
    .tree small { max-width: 100%; margin: -7px 2px 6px; color: var(--gray); font-size: calc(10px * var(--text-scale)); line-height: 1.3; text-align: center; }
    .tree:hover small, .tree:focus-visible small, .tree[aria-pressed="true"] small { color: var(--off-white); }

    .topic-panel {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: min(780px, 92%);
      min-height: 36px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .topic-panel:empty { display: none; }
    :root[data-theme="light"] .tree { background: rgba(255, 255, 250, .55); }
    :root[data-theme="light"] .tree:hover,
    :root[data-theme="light"] .tree:focus-visible,
    :root[data-theme="light"] .tree[aria-pressed="true"] { background: rgba(255, 255, 250, .96); }
    .bubble {
      position: relative;
      max-width: 320px;
      border: 1px solid rgba(182, 243, 107, .22);
      border-radius: 12px;
      background: rgba(17, 24, 20, .96);
      padding: 10px 14px;
      color: var(--off-white);
      cursor: pointer;
      text-align: left;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
      animation: bubble-in .22s ease both;
    }
    .bubble::after {
      content: "";
      position: absolute;
      left: 20px;
      bottom: -7px;
      width: 12px;
      height: 12px;
      background: inherit;
      border-right: 1px solid rgba(182, 243, 107, .22);
      border-bottom: 1px solid rgba(182, 243, 107, .22);
      transform: rotate(45deg);
    }
    .bubble:hover { border-color: var(--leaf); background: var(--forest); }
    :root[data-theme="light"] .bubble {
      background: var(--surface);
      border-color: rgba(91, 137, 61, .3);
      color: var(--off-white);
      box-shadow: 0 5px 18px rgba(49, 92, 69, .1);
    }
    :root[data-theme="light"] .bubble::after { border-color: rgba(91, 137, 61, .3); }
    :root[data-theme="light"] .bubble:hover { background: #EEF5E8; box-shadow: 0 8px 22px rgba(91, 137, 61, .2); }
    @keyframes bubble-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .composer-wrap { width: min(760px, 92%); margin: 0 auto; align-self: end; }
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 58px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .22);
    }
    .composer:focus-within { border-color: rgba(182, 243, 107, .42); }
    .composer textarea {
      width: 100%;
      min-height: 40px;
      max-height: 160px;
      resize: none;
      overflow-y: auto;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--off-white);
      padding: 9px 8px 7px;
      line-height: 21px;
    }
    .composer textarea::placeholder { color: #7F877F; }
    .send-btn {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: var(--leaf);
      color: #10200F;
      cursor: pointer;
    }
    .send-btn:disabled { cursor: default; opacity: .38; }

    .chat { position: relative; isolation: isolate; overflow: hidden; display: none; height: 100%; width: 100%; background: var(--black); grid-template-rows: 68px minmax(0, 1fr) auto; transition: width .26s ease; }
    .chat.active { display: grid; }
    .main.thread-open .chat.active { width: calc(100% - var(--thread-width)); }
    .landing.hidden { display: none; }
    .conversation-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 26px;
      border-bottom: 1px solid var(--line);
      background: rgba(9, 11, 10, .96);
    }
    .conversation-head h2 { margin: 0; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: calc(15px * var(--text-scale)); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--leaf); box-shadow: 0 0 10px rgba(182, 243, 107, .35); }
    .messages { overflow-y: auto; padding: 26px max(24px, calc((100% - 820px) / 2)); scroll-behavior: smooth; }
    .messages[data-width="wide"] { padding-left: 28px; padding-right: 28px; }
    .message { width: 100%; }
    .messages[data-width="wide"] .message { max-width: 980px; }
    .messages[data-width="wide"] .message-row.user .message { max-width: 820px; }
    :root[data-density="compact"] .message-row { margin-bottom: 12px; }
    :root[data-density="compact"] .bubble-message { padding-top: 7px; padding-bottom: 7px; }
    .message-row { display: flex; margin: 0 0 24px; }
    .message-row.user { justify-content: flex-end; }
    .message { max-width: 720px; }
    .message-row.user .message { max-width: 620px; }
    .message-meta { margin: 0 0 7px; color: var(--gray); font-size: calc(12px * var(--text-scale)); }
    .message-row.user .message-meta { text-align: right; }
    .bubble-message {
      padding: 10px 14px;
      border-radius: 12px 12px 12px 3px;
      background: var(--surface);
      border: 1px solid var(--line);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message-row.user .bubble-message { border-radius: 12px 12px 3px 12px; background: var(--forest); border-color: rgba(182, 243, 107, .12); }
    .message-meta.with-mascot {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .mascot-avatar {
      width: 28px;
      height: 28px;
      display: inline-block;
      border-radius: 7px;
      overflow: hidden;
      background: #0D140F;
    }
    .answer-tools { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .answer-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-top: 7px; }
    .answer-action {
      min-width: 32px;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--gray);
      cursor: pointer;
      font-size: calc(12px * var(--text-scale));
      transition: background .16s ease, color .16s ease;
    }
    .answer-action:hover, .answer-action[aria-pressed="true"] { background: var(--surface-2); color: var(--off-white); }
    .answer-action svg { width: 15px; height: 15px; }
    .answer-action:disabled { opacity: .45; cursor: default; }
    .answer-action.saved { color: var(--leaf); }
    .message-time { margin-top: 4px; color: var(--gray); font-size: calc(11px * var(--text-scale)); }
    .message-time[hidden] { display: none; }
    .message-content h2, .message-content h3 { margin: 14px 0 6px; font-size: 1.08em; }
    .message-content p { margin: 0 0 8px; }
    .message-content ul, .message-content ol { margin: 6px 0 10px; padding-left: 22px; }
    .message-content a { color: var(--leaf); text-decoration: underline; }
    .message-table-wrap { max-width: 100%; margin: 8px 0 12px; overflow-x: auto; }
    .message-content table { width: 100%; border-collapse: collapse; font-size: .92em; }
    .message-content th, .message-content td { padding: 7px 9px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    .message-content th { background: var(--surface-2); }
    .grounding {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--leaf);

    async function requestAnswer(question) {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message: question})
      });
      const body = await response.text();
      let data;
      try {
        data = body ? JSON.parse(body) : null;
      } catch (error) {
        console.error("Kordi API returned an invalid response body.", error);
        throw new Error("The information is not yet available. Please try again later.");
      }
      if (!response.ok) {
        const detail = data && typeof data.detail === "string" ? data.detail : null;
        throw new Error(detail || "The information is not yet available. Please try again later.");
      }
      if (!data || typeof data.answer !== "string" || !data.answer.trim()) {
        throw new Error("The information is not yet available. Please try again later.");
      }
      return data;
    }

    async function sendQuestion(question) {
      if (busy || !question.trim()) return;
      if (question.trim().length > 500) {
        showToast("Please keep your question under 500 characters.", true);
        return;
      }
      busy = true;

      let conversation = getConversation();
      if (!conversation) conversation = createConversation(question);
      enterChat();
      document.getElementById("conversationTitle").textContent = conversation.title;
      document.getElementById("landingInput").value = "";

      appendMessage({role:"user", text:question, id:makeId()}, true, conversation);
      appendLoading();
      renderHistory();

      try {
        const data = await requestAnswer(question);
        document.getElementById("loadingRow")?.remove();
        appendMessage({
          role:"assistant",
          text:data.answer,
          grounded:Boolean(data.grounded),
          sources:Array.isArray(data.sources) ? data.sources : [],
          id:makeId(),
          userMessage:question
        }, true, conversation);
      } catch (error) {
        console.error("Kordi chat request failed.", error);
        document.getElementById("loadingRow")?.remove();
        appendMessage({
          role:"assistant",
          text:error.message || "Could not reach Kordi. Please try again.",
          grounded:false,
          sources:[],
          id:makeId(),
          userMessage:question
        }, true, conversation);
      } finally {
        busy = false;
        if (activeId === conversation.id) {
          document.getElementById("chatInput").value = "";
          document.getElementById("chatInput").style.height = "auto";
          document.getElementById("chatInput").focus();
        }
      }
    }

    function renderMarkdown(container, text) {
      container.replaceChildren();
      const lines = String(text || "").split(/\r?\n/);
      let list = null;
      let paragraph = [];
      const flushParagraph = () => {
        if (!paragraph.length) return;
        const p = document.createElement("p");
        appendInline(p, paragraph.join(" "));
        container.appendChild(p);
        paragraph = [];
      };
      const closeList = () => {
        if (list) {
          container.appendChild(list);
          list = null;
        }
      };
      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        if (/^\s*\|.*\|\s*$/.test(line)) {
          flushParagraph();
          closeList();
          const tableLines = [];
          while (index < lines.length && /^\s*\|.*\|\s*$/.test(lines[index])) {
            tableLines.push(lines[index].trim());
            index += 1;
          }
          index -= 1;
          const rows = tableLines.map(row => row.slice(1, -1).split("|").map(cell => cell.trim()));
          const hasHeader = rows.length > 1 && rows[1].every(cell => /^:?-{3,}:?$/.test(cell));
          const table = document.createElement("table");
          const head = document.createElement("thead");
          const body = document.createElement("tbody");
          rows.forEach((cells, rowIndex) => {
            if (hasHeader && rowIndex === 1) return;
            const row = document.createElement("tr");
            cells.forEach(value => {
              const cell = document.createElement(hasHeader && rowIndex === 0 ? "th" : "td");
              appendInline(cell, value);
              row.appendChild(cell);
            });
            (hasHeader && rowIndex === 0 ? head : body).appendChild(row);
          });
          if (hasHeader) table.appendChild(head);
          table.appendChild(body);
          const wrapper = document.createElement("div");
          wrapper.className = "message-table-wrap";
          wrapper.appendChild(table);
          container.appendChild(wrapper);
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const bullet = line.match(/^\s*[-*]\s+(.+)$/);
        const numbered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeList();
          const element = document.createElement(heading[1].length === 1 ? "h2" : "h3");
          appendInline(element, heading[2]);
          container.appendChild(element);
        } else if (bullet || numbered) {
          flushParagraph();
          const expected = numbered ? "ol" : "ul";
          if (!list || list.tagName.toLowerCase() !== expected) {
            closeList();
            list = document.createElement(expected);
          }
          const item = document.createElement("li");
          appendInline(item, (bullet || numbered)[1]);
          list.appendChild(item);
        } else if (!line.trim()) {
          flushParagraph();
          closeList();
        } else {
          closeList();
          paragraph.push(line);
        }
      }
      flushParagraph();
      closeList();
    }

    function appendInline(parent, text) {
      const tokenPattern = /(https?:\/\/[^\s<>]+|\*\*[^*]+\*\*|`[^`]+`)/g;
      let cursor = 0;
      let match;
      while ((match = tokenPattern.exec(text))) {
        parent.appendChild(document.createTextNode(text.slice(cursor, match.index)));
        const token = match[0];
        if (token.startsWith("**")) {
          const strong = document.createElement("strong");
          strong.textContent = token.slice(2, -2);
          parent.appendChild(strong);
        } else if (token.startsWith("`")) {
          const code = document.createElement("code");
          code.textContent = token.slice(1, -1);
          parent.appendChild(code);
        } else {
          const link = document.createElement("a");
          link.href = token;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = token;
          parent.appendChild(link);
        }
        cursor = tokenPattern.lastIndex;
      }
      parent.appendChild(document.createTextNode(text.slice(cursor)));
    }

    function setFeedback(message, feedback) {
      message.feedback = feedback;
      persistConversations();
      const conversation = getConversation();
      if (conversation) renderConversation(conversation, message.id);
      showToast(feedback ? "Feedback saved in this browser only." : "Feedback removed.");
    }

    async function copyResponse(text, button) {
      try {
        await navigator.clipboard.writeText(text);
        const original = button.innerHTML;
        button.textContent = "Copied";
        showToast("Response copied.");
        setTimeout(() => {
          if (button.isConnected) button.innerHTML = original;
        }, 1200);
      } catch (error) {
        console.error("Could not copy the Kordi response.", error);
        showToast("Could not copy the response. Check clipboard permissions.", true);
      }
    }

    function toggleSaved(message) {
      message.saved = !message.saved;
      persistConversations();
      const conversation = getConversation();
      if (conversation) renderConversation(conversation, message.id);
      renderSavedResponses();
      showToast(message.saved ? "Response saved on this device." : "Response removed from saved items.");
    }

    const savedOverlay = document.getElementById("savedOverlay");
    const savedList = document.getElementById("savedList");
    function renderSavedResponses() {
      savedList.replaceChildren();
      const saved = [];
      conversations.forEach(conversation => conversation.messages.forEach(message => {
        if (message.role === "assistant" && message.saved) saved.push({conversation, message});
      }));
      if (!saved.length) {
        const empty = document.createElement("div");
        empty.className = "search-empty";
        empty.textContent = "Saved responses will appear here. They are stored only in this browser.";
        savedList.appendChild(empty);
        return;
      }
      saved.forEach(({conversation, message}) => {
        const item = document.createElement("article");
        item.className = "saved-item";
        const title = document.createElement("strong");
        title.textContent = conversation.title;
        const content = document.createElement("p");
        content.textContent = message.text;
        const actions = document.createElement("div");
        actions.className = "saved-item-actions";
        const revisit = document.createElement("button");
        revisit.className = "secondary-button";
        revisit.textContent = "Open conversation";
        revisit.addEventListener("click", () => {
          savedOverlay.classList.remove("open");
          openConversation(conversation.id, message.id);
        });
        const remove = document.createElement("button");
        remove.className = "secondary-button";
        remove.textContent = "Unsave";
        remove.addEventListener("click", () => {
          message.saved = false;
          persistConversations();
          renderSavedResponses();
          if (activeId === conversation.id) renderConversation(conversation, message.id);
        });
        actions.append(revisit, remove);
        item.append(title, content, actions);
        savedList.appendChild(item);
      });
    }
    document.getElementById("savedBtn").addEventListener("click", () => {
      renderSavedResponses();
      savedOverlay.classList.add("open");
      closeMobileSidebar();
    });
    document.getElementById("closeSaved").addEventListener("click", () => savedOverlay.classList.remove("open"));
    savedOverlay.addEventListener("click", event => { if (event.target === savedOverlay) savedOverlay.classList.remove("open"); });

    async function regenerateMessage(message, button) {
      if (!message.userMessage || message.regenerating) return;
      const targetConversation = getConversation();
      message.regenerating = true;
      button.disabled = true;
      button.title = "Regenerating response...";
      button.textContent = "Regenerating...";
      showToast("Regenerating through the existing chat service...");
      try {
        const data = await requestAnswer(message.userMessage);
        message.text = data.answer;
        message.grounded = Boolean(data.grounded);
        message.sources = Array.isArray(data.sources) ? data.sources : [];
        message.createdAt = new Date().toISOString();
        message.regenerating = false;
        if (targetConversation) targetConversation.updatedAt = message.createdAt;
        persistConversations();
        if (activeId === targetConversation.id) renderConversation(targetConversation, message.id);
        showToast("Response regenerated.");
      } catch (error) {
        console.error("Kordi response regeneration failed.", error);
        showToast(error.message || "Could not regenerate the response. The previous answer is unchanged.", true);
        button.disabled = false;
        button.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 2M4 16l2 2a7 7 0 0 0 12.4-3"/></svg>';
        button.title = "Regenerate response";
        message.regenerating = false;
      }
    }

    const threadPanel = document.getElementById("threadPanel");
    const threadContent = document.getElementById("threadContent");
    function openThread(messageId) {
      const conversation = getConversation();
      if (!conversation) return;
      const parent = conversation.messages.find(message => message.id === messageId && message.role === "assistant");
      if (!parent) return;
      conversation.threads = conversation.threads || {};
      conversation.threads[messageId] = conversation.threads[messageId] || {parentId: messageId, replies: []};
      activeThreadId = messageId;
      app.querySelector(".main").classList.add("thread-open");
      threadPanel.classList.add("open");
      threadPanel.setAttribute("aria-hidden", "false");
      if (window.innerWidth <= 640) threadPanel.setAttribute("aria-modal", "true");
      renderThread(conversation, parent, true);
      closeMobileSidebar();
      if (window.innerWidth <= 640) threadPanel.querySelector("#threadInput").focus();
    }
    function closeThread() {
      const previousThreadId = activeThreadId;
      activeThreadId = null;
      threadPanel.classList.remove("open");
      threadPanel.setAttribute("aria-hidden", "true");
      threadPanel.removeAttribute("aria-modal");
      app.querySelector(".main").classList.remove("thread-open");
      if (previousThreadId && window.innerWidth <= 640) {
        document.getElementById("message-" + previousThreadId)?.querySelector('[aria-label="Reply in thread"]')?.focus();
      }
    }
    document.getElementById("closeThread").addEventListener("click", closeThread);
    function renderThread(conversation, parent, scrollToBottom) {
      threadContent.replaceChildren();
      const parentCard = document.createElement("div");
      parentCard.className = "thread-parent";
      const label = document.createElement("div");
      label.className = "thread-parent-label";
      label.textContent = "Kordi's response · Thread replies are saved on this device";
      const text = document.createElement("div");
      text.className = "thread-parent-text";
      text.textContent = parent.text;
      parentCard.append(label, text);
      threadContent.appendChild(parentCard);
      const thread = conversation.threads[parent.id];
      if (!thread.replies.length) {
        const empty = document.createElement("div");
        empty.className = "thread-empty";
        const mascot = document.createElement("img");
        mascot.src = "../assets/kordi.png";
        mascot.alt = "Kordi";
        mascot.draggable = false;
        const prompt = document.createElement("div");
        prompt.textContent = "Continue this idea here. The main conversation will stay as it is.";
        empty.append(mascot, prompt);
        threadContent.appendChild(empty);
      }
      thread.replies.forEach(reply => {
        const item = document.createElement("div");
        item.className = "thread-reply " + reply.role;
        const content = document.createElement("div");
        content.className = "thread-reply-text";
        if (reply.role === "assistant") renderMarkdown(content, reply.text);
        else content.textContent = reply.text;
        item.appendChild(content);
        threadContent.appendChild(item);
      });
      if (scrollToBottom) threadContent.scrollTop = threadContent.scrollHeight;
    }
    document.getElementById("threadForm").addEventListener("submit", async event => {
      event.preventDefault();
      const input = document.getElementById("threadInput");
      const question = input.value.trim();
      const conversation = getConversation();
      if (!question || !conversation || !activeThreadId || threadBusy) return;
      if (question.length > 350) {
        showToast("Keep a thread reply under 350 characters.", true);
        return;
      }
      const parent = conversation.messages.find(message => message.id === activeThreadId);
      if (!parent) {
        showToast("This thread's original response is no longer available.", true);
        return;
      }
      conversation.threads = conversation.threads || {};
      const thread = conversation.threads[activeThreadId];
      thread.replies.push({id: makeId(), role: "user", text: question, createdAt: new Date().toISOString()});
      conversation.updatedAt = new Date().toISOString();
      persistConversations();
      renderThread(conversation, parent, true);
      input.value = "";
      input.style.height = "auto";
      threadBusy = true;
      const send = document.querySelector("#threadForm .send-btn");
      send.disabled = true;
      const contextLimit = Math.max(0, 500 - question.length - 26);
      const recentContext = thread.replies.slice(-5, -1).map(reply => reply.role + ": " + reply.text.slice(0, 65)).join("\n");
      const context = ("Regarding Kordi's response: " + parent.text + "\n" + recentContext).slice(0, contextLimit);
      const prompt = context ? context + "\nFollow-up: " + question : question;
      const loading = document.createElement("div");
      loading.className = "thread-empty loading";
      loading.textContent = "Kordi is responding...";
      threadContent.appendChild(loading);
      try {
        const data = await requestAnswer(prompt);
        thread.replies.push({id: makeId(), role: "assistant", text: data.answer, grounded: Boolean(data.grounded), sources: Array.isArray(data.sources) ? data.sources : [], createdAt: new Date().toISOString()});
      } catch (error) {
        console.error("Kordi thread request failed.", error);
        thread.replies.push({id: makeId(), role: "assistant", text: error.message || "Could not reach Kordi. Please try again.", grounded: false, sources: [], createdAt: new Date().toISOString()});
      } finally {
        threadBusy = false;
        send.disabled = false;
        persistConversations();
        if (activeId === conversation.id) {
          if (activeThreadId === parent.id) renderThread(conversation, parent, true);
          const previousScroll = messages.scrollTop;
          renderConversation(conversation);
          messages.scrollTop = previousScroll;
          if (activeThreadId === parent.id) input.focus();
        }
      }
    });

    function renderSettings(tab) {
      activeSettingsTab = tab || activeSettingsTab;
      document.querySelectorAll(".settings-tab").forEach(button => {
        button.classList.toggle("active", button.dataset.settingsTab === activeSettingsTab);
      });
      const content = document.getElementById("settingsContent");
      const sections = {
        appearance: '<section class="settings-section"><h3>Appearance</h3><p>Choose how Kakaywán looks on this device.</p><div class="setting-row"><label for="setting-theme">Color theme</label><select id="setting-theme" data-setting="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div></section>',
        display: '<section class="settings-section"><h3>Text &amp; display</h3><p>Adjust reading comfort. Changes preview immediately.</p><div class="setting-row"><label for="setting-textSize">Text size</label><select id="setting-textSize" data-setting="textSize"><option value="small">Small</option><option value="default">Default</option><option value="large">Large</option></select></div><div class="setting-row"><label for="setting-chatWidth">Chat width</label><select id="setting-chatWidth" data-setting="chatWidth"><option value="comfortable">Comfortable</option><option value="wide">Wide</option></select></div><div class="setting-row"><label for="setting-density">Message spacing</label><select id="setting-density" data-setting="density"><option value="compact">Compact</option><option value="comfortable">Comfortable</option></select></div></section>',
        conversation: '<section class="settings-section"><h3>Conversation</h3><p>Control sending, scrolling, timestamps, and deletion.</p>' + settingCheckbox("enterToSend", "Enter to send", "Shift + Enter always inserts a line break.") + settingCheckbox("autoScroll", "Auto-scroll to new messages", "Keep the latest message in view.") + settingCheckbox("showTimestamps", "Show message timestamps", "Display local date and time on each message.") + settingCheckbox("confirmDelete", "Confirm before deleting", "Ask before removing a conversation and its local threads.") + '</section>',
        accessibility: '<section class="settings-section"><h3>Accessibility</h3><p>Reduce motion and improve interface contrast.</p>' + settingCheckbox("reducedMotion", "Reduce motion", "Turn off decorative movement and long transitions.") + settingCheckbox("highContrast", "Improved contrast", "Strengthen borders and secondary text contrast.") + '<div class="setting-row"><span><span class="setting-label">Keyboard navigation</span><span class="setting-description">Use Tab, Shift + Tab, Enter, and Escape to navigate.</span></span></div></section>',
        about: '<section class="settings-section"><div class="about-mascot"><img src="../assets/kordi.png" alt="Kordi mascot" draggable="false"></div><h3>About Kakaywán AI</h3><p><strong>Kakaywán AI</strong> is an environmental information and eco-literacy assistant for Baguio City. Kordi helps residents and visitors explore environmental topics using approved records. Answers may be incomplete; check the cited sources and official guidance.</p><div class="setting-row"><span><span class="setting-label">Assistant</span><span class="setting-description">Kordi · Baguio City environmental guide</span></span></div></section>'
      };
      content.innerHTML = sections[activeSettingsTab] || sections.appearance;
      content.querySelectorAll("select[data-setting]").forEach(select => {
        select.value = settings[select.dataset.setting];
        select.addEventListener("change", () => {
          settings[select.dataset.setting] = select.value;
          persistSettings();
          renderConversation(getConversation());
        });
      });
      content.querySelectorAll("input[data-setting]").forEach(input => {
        input.checked = Boolean(settings[input.dataset.setting]);
        input.addEventListener("change", () => {
          settings[input.dataset.setting] = input.checked;
          persistSettings();
          renderConversation(getConversation());
        });
      });
      const footer = document.createElement("div");
      footer.className = "settings-footer";
      const reset = document.createElement("button");
      reset.className = "secondary-button";
      reset.textContent = "Reset defaults";
      reset.addEventListener("click", () => {
        settings = Object.assign({}, defaultSettings);
        persistSettings();
        showToast("Settings reset.");
      });
      footer.appendChild(reset);
      content.appendChild(footer);
    }
    function settingCheckbox(key, label, description) {
      return '<div class="setting-row"><span><label for="setting-' + key + '">' + label + '</label><span class="setting-description">' + description + '</span></span><input id="setting-' + key + '" type="checkbox" data-setting="' + key + '"></div>';
    }
    const settingsOverlay = document.getElementById("settingsOverlay");
    document.getElementById("settingsBtn").addEventListener("click", () => {
      renderSettings("appearance");
      settingsOverlay.classList.add("open");
      closeMobileSidebar();
    });
    document.getElementById("closeSettings").addEventListener("click", () => settingsOverlay.classList.remove("open"));
    settingsOverlay.addEventListener("click", event => { if (event.target === settingsOverlay) settingsOverlay.classList.remove("open"); });
    document.querySelectorAll(".settings-tab").forEach(button => button.addEventListener("click", () => renderSettings(button.dataset.settingsTab)));
    applySettings();

    const collapseBtn = document.getElementById("collapseBtn");
    collapseBtn.addEventListener("click", () => {
      if (window.innerWidth <= 640) {
        closeMobileSidebar();
      } else {
        app.classList.toggle("sidebar-expanded");
        const expanded = app.classList.contains("sidebar-expanded");
        collapseBtn.setAttribute("aria-expanded", String(expanded));
        collapseBtn.title = expanded ? "Collapse sidebar" : "Expand sidebar";
        collapseBtn.setAttribute("aria-label", expanded ? "Collapse sidebar" : "Expand sidebar");
      }
    });
    document.getElementById("mobileMenu").addEventListener("click", () => app.classList.add("mobile-sidebar-open"));
    document.getElementById("backdrop").addEventListener("click", closeMobileSidebar);
    function closeMobileSidebar() { app.classList.remove("mobile-sidebar-open"); }
    function setInitialSidebar() {
      app.classList.remove("sidebar-expanded", "mobile-sidebar-open");
      collapseBtn.setAttribute("aria-expanded", "false");
      collapseBtn.title = "Expand sidebar";
      collapseBtn.setAttribute("aria-label", "Expand sidebar");
    }
    setInitialSidebar();

    const searchOverlay = document.getElementById("searchOverlay");
    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");
    function openSearch() {
      searchOverlay.classList.add("open");
      searchInput.value = "";
      renderSearch("");
      closeMobileSidebar();
      setTimeout(() => searchInput.focus(), 0);
    }
    function closeSearch() { searchOverlay.classList.remove("open"); }
    document.getElementById("searchBtn").addEventListener("click", openSearch);
    document.getElementById("closeSearch").addEventListener("click", closeSearch);
    document.getElementById("clearSearch").addEventListener("click", () => {
      searchInput.value = "";
      renderSearch("");
      searchInput.focus();
    });
    searchOverlay.addEventListener("click", event => { if (event.target === searchOverlay) closeSearch(); });
    searchInput.addEventListener("input", () => renderSearch(searchInput.value));
    document.addEventListener("keydown", event => { if (event.key === "Escape") closeSearch(); });

    window.addEventListener("load", () => {
      document.getElementById("loadingScreen").classList.add("done");
    });

    function renderSearch(query) {
      const needle = query.trim().toLowerCase();
      const matches = [];
      conversations.forEach(conversation => {
        const titleMatches = conversation.title.toLowerCase().includes(needle);
        const messageMatches = conversation.messages.filter(item => item.text.toLowerCase().includes(needle));
        if (!needle || titleMatches || messageMatches.length) {
          matches.push({conversation, message: messageMatches[0], snippet: messageMatches[0]?.text || conversation.title});
        }
      });
      searchResults.innerHTML = "";
      if (!matches.length) {
        searchResults.innerHTML = '<div class="search-empty">No matching conversations on this device.</div>';
        return;
      }
      matches.forEach(match => {
        const button = document.createElement("button");
        button.className = "search-result";
        button.innerHTML = "<strong></strong><span></span>";
        button.children[0].textContent = match.conversation.title;
        button.children[1].textContent = match.snippet;
        button.addEventListener("click", () => { closeSearch(); openConversation(match.conversation.id, match.message && match.message.id); });
        searchResults.appendChild(button);
      });
    }
    renderHistory();
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeThread();
        settingsOverlay.classList.remove("open");
        savedOverlay.classList.remove("open");
      }
    });
    document.addEventListener("keydown", event => {
      if (event.key !== "Tab") return;
      const modal = document.querySelector(".modal-layer.open, .search-overlay.open")
        || (window.innerWidth <= 640 && threadPanel.classList.contains("open") ? threadPanel : null);
      if (!modal) return;
      const controls = modal.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])');
      if (!controls.length) return;
      const first = controls[0];
      const last = controls[controls.length - 1];
      if (event.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && (document.activeElement === last || !modal.contains(document.activeElement))) {
        event.preventDefault();
        first.focus();
      }
    });
  </script>
</body>
